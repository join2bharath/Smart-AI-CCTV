<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>{% block title %}College Management System{% endblock %}</title>
  <meta name="description" content="{% block meta_desc %}College Management System — Secure, AI-powered campus management platform.{% endblock %}"/>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}"/>
  {% block extra_css %}{% endblock %}
</head>
<body class="{% block body_class %}{% endblock %}">

{% with messages = get_flashed_messages(with_categories=true) %}
  {% if messages %}
    <div class="flash-container" id="flashContainer">
      {% for cat, msg in messages %}
        <div class="flash flash-{{ cat }}">
          <i class="fa {% if cat=='success' %}fa-check-circle{% elif cat=='danger' %}fa-exclamation-circle{% else %}fa-info-circle{% endif %}"></i>
          {{ msg }}
          <button class="flash-close" onclick="this.parentElement.remove()"><i class="fa fa-times"></i></button>
        </div>
      {% endfor %}
    </div>
  {% endif %}
{% endwith %}

{% block body %}{% endblock %}

<script src="{{ url_for('static', filename='js/main.js') }}"></script>
{% block extra_js %}{% endblock %}
</body>
</html>
