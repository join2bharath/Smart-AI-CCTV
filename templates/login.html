{% extends "base.html" %}
{% block title %}Login — College Management System{% endblock %}
{% block body_class %}login-page{% endblock %}

{% block body %}
<div class="login-bg">
  <div class="login-particles" id="particles"></div>
  <div class="login-card glass">
    <div class="login-logo">
      <div class="logo-icon"><i class="fa fa-graduation-cap"></i></div>
      <h1>College<span>CMS</span></h1>
      <p>Unified Campus Management Platform</p>
    </div>

    <form method="POST" action="{{ url_for('auth.login') }}" class="login-form" id="loginForm">
      <div class="form-group">
        <label for="username"><i class="fa fa-user"></i> Username</label>
        <input type="text" id="username" name="username" placeholder="student001 / staff@01 / HOD@01 / Principal_1"
               autocomplete="username" required/>
      </div>

      <div class="form-group">
        <label for="password"><i class="fa fa-lock"></i> Password</label>
        <div class="input-eye">
          <input type="password" id="password" name="password" placeholder="Enter your password" autocomplete="current-password" required/>
          <button type="button" class="eye-btn" id="eyeBtn" onclick="togglePassword()" tabindex="-1">>
            <i class="fa fa-eye" id="eyeIcon"></i>
          </button>
        </div>
      </div>

      <div class="form-row">
        <label class="checkbox-label">
          <input type="checkbox" name="remember" id="remember"/>
          <span class="checkmark"></span>
          Remember me
        </label>
        <a href="{{ url_for('auth.forgot_password') }}" class="forgot-link">Forgot password?</a>
      </div>

      <button type="submit" class="btn-login" id="loginBtn">
        <span id="loginText"><i class="fa fa-sign-in-alt"></i> Sign In</span>
        <span id="loginSpinner" style="display:none;"><i class="fa fa-spinner fa-spin"></i> Signing in…</span>
      </button>
    </form>

    <div class="login-roles">
      <span>Quick fill:</span>
      <button class="role-tag" onclick="fillLogin('student001','')">Student</button>
      <button class="role-tag" onclick="fillLogin('staff@01','Welcome@123')">Staff</button>
      <button class="role-tag" onclick="fillLogin('HOD@01','welcome@123')">HOD</button>
      <button class="role-tag" onclick="fillLogin('Principal_1','Principal@123')">Principal</button>
    </div>

    <div class="login-footer">
      <p><i class="fa fa-shield-alt"></i> Secured with bcrypt encryption</p>
    </div>
  </div>
</div>

<script>
function togglePassword() {
  const p = document.getElementById('password');
  const i = document.getElementById('eyeIcon');
  if (p.type === 'password') {
    p.type = 'text';
    i.className = 'fa fa-eye-slash';
  } else {
    p.type = 'password';
    i.className = 'fa fa-eye';
  }
}
function fillLogin(user, pass) {
  document.getElementById('username').value = user;
  document.getElementById('password').value = pass;
}
document.getElementById('loginForm').addEventListener('submit', function() {
  document.getElementById('loginText').style.display = 'none';
  document.getElementById('loginSpinner').style.display = 'inline';
});

// Particle background
(function() {
  const c = document.getElementById('particles');
  for (let i = 0; i < 60; i++) {
    const s = document.createElement('span');
    s.className = 'particle';
    s.style.cssText = `left:${Math.random()*100}%;top:${Math.random()*100}%;
      width:${Math.random()*4+2}px;height:${Math.random()*4+2}px;
      animation-delay:${Math.random()*8}s;animation-duration:${Math.random()*10+8}s`;
    c.appendChild(s);
  }
})();
</script>
{% endblock %}
